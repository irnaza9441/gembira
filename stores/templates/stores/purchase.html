{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <h2>Purchase complete</h2>
    <hr />
    <p>Please review your order below and click Purchase to place it.</p>
    <p>Total: <strong>${{ template_data.total }}</strong></p>
    <div class="mt-3">
      <a href="{% url 'stores.cafe' %}" class="btn btn-primary me-2">Back to drinks</a>
      <form method="post" action="{% url 'stores.complete_purchase' %}" style="display:inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Purchase</button>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
