{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <h2>Purchase complete</h2>
    <hr />
    <p>Please review your order below and complete payment to place it.</p>
    <p>Total to pay: <strong>${{ template_data.total }}</strong></p>
    <div class="mt-3">
      <a href="{% url 'stores.cafe' %}" class="btn btn-primary me-2">Back to drinks</a>
      <!-- Stripe test checkout button -->
      <button id="stripe-pay" class="btn btn-outline-success">Pay with Stripe (test)</button>
      <script>
        document.getElementById('stripe-pay').addEventListener('click', async function (e) {
          e.preventDefault();
          this.disabled = true;
          try {
            const resp = await fetch("{% url 'stores.stripe_create_session' %}", {
              method: 'GET',
              headers: { 'X-Requested-With': 'XMLHttpRequest' },
            });
            if (!resp.ok) {
              const text = await resp.text();
              alert('Payment start failed: ' + resp.status + ' ' + text);
              this.disabled = false;
              return;
            }
            const data = await resp.json();
            if (data && data.url) {
              // Navigate to Stripe Checkout
              window.location.href = data.url;
            } else {
              alert('Payment start failed: no url returned');
              this.disabled = false;
            }
          } catch (err) {
            alert('Payment start error: ' + err.message);
            this.disabled = false;
          }
        });
      </script>
    </div>
  </div>
</div>
{% endblock content %}
